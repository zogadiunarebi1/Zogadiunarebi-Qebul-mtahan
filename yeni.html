<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZQİ | Qeydiyyat</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Plus Jakarta Sans',Arial;margin:0}
body{background:#F6F7FB;color:#111827}
.wrap{max-width:440px;margin:0 auto;padding:16px}
.top{text-align:center;padding:18px 0 10px}
.logo{width:56px;height:56px;background:#111827;color:#fff;border-radius:16px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;margin:0 auto}
.logo span{color:#FF3B30}
h1{font-size:22px;margin-top:10px}
.sub{color:#6B7280;font-size:13px;margin-top:4px}
.card{background:#fff;border:1px solid #E5E7EB;border-radius:18px;padding:16px;margin-top:14px}
label{font-size:12px;font-weight:700;color:#374151;display:block;margin:12px 0 6px}
label:first-child{margin-top:0}
input,select{width:100%;padding:13px;border:1px solid #E5E7EB;border-radius:12px;outline:none;font-size:14px;background:#fff}
input:focus,select:focus{border-color:#2563EB}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:#111827;color:#fff;font-weight:800;font-size:15px;cursor:pointer;margin-top:16px}
.btn2{width:100%;padding:12px;border:0;border-radius:12px;background:#EEF2FF;color:#2563EB;font-weight:800;margin-top:8px;cursor:pointer}
.msg{padding:11px;border-radius:12px;font-size:13px;font-weight:700;text-align:center;display:none;margin-top:12px}
.msg.err{background:#FEE2E2;color:#991B1B}
.msg.ok{background:#D1FAE5;color:#065F46}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div class="logo">ZQ<span>İ</span></div><h1>Hesab yarat</h1><p class="sub">Admin təsdiqlədikdən sonra daxil ola biləcəksən</p></div>

<div class="card">
<label>Ad *</label><input id="ad" placeholder="Məs: Hüseyn">
<label>Soyad *</label><input id="soyad" placeholder="Məs: Hüseynli">
<label>İstifadəçi adı *</label><input id="username" placeholder="Məs: huseyn">
<label>Şifrə *</label><input id="password" type="password" placeholder="Ən azı 3 simvol">
<label>Sinif</label>
<select id="sinif"><option value="9">9-cu sinif</option><option value="10">10-cu sinif</option><option value="11">11-ci sinif</option><option value="Abituriyent">Abituriyent</option></select>
<label>Yaşadığı yer</label><input id="bolge" placeholder="Məs: Bakı">
<label>E-poçt</label><input id="email" placeholder="Məs: huseyn@gmail.com">
<label>Telefon</label><input id="tel" placeholder="Məs: 050 123 45 67">

<div id="msg" class="msg"></div>
<button class="btn" onclick="qeydiyyat()">Qeydiyyatı tamamla →</button>
<button class="btn2" onclick="getGiris()">Artıq hesabım var - Giriş</button>
</div>
</div>

<script>
function goster(text, ok){
  var m=document.getElementById('msg');
  m.style.display='block';
  m.className='msg '+(ok?'ok':'err');
  m.innerText=text;
}
function getGiris(){
  window.location.href="https://htmlpreview.github.io/?https://raw.githubusercontent.com/zogadiunarebi1/Zogadiunarebi-Qebul-mtahan/main/yeni.html";
}
function qeydiyyat(){
  var ad=document.getElementById('ad').value.trim();
  var soyad=document.getElementById('soyad').value.trim();
  var username=document.getElementById('username').value.trim().toLowerCase();
  var password=document.getElementById('password').value.trim();
  var sinif=document.getElementById('sinif').value;
  var bolge=document.getElementById('bolge').value.trim();
  var email=document.getElementById('email').value.trim();
  var tel=document.getElementById('tel').value.trim();

  if(!ad || !soyad || !username || !password){
    goster("❌ Zəhmət olmasa Ad, Soyad, İstifadəçi adı və Şifrəni doldur!", false);
    return;
  }
  if(password.length < 3){
    goster("❌ Şifrə ən azı 3 simvol olmalıdır!", false);
    return;
  }

  var users=[];
  try{ users=JSON.parse(localStorage.getItem("zqi_users")||"[]"); }catch(e){ users=[]; }

  var varMi = users.find(function(u){ return u.username==username; });
  if(varMi){
    goster("❌ Bu istifadəçi adı artıq var! Başqasını yaz.", false);
    return;
  }

  users.push({ ad: ad, soyad: soyad, username: username, password: password, sinif: sinif, bolge: bolge, email: email, tel: tel, status: "pending", vaxt: new Date().toLocaleString('az-AZ') });
  localStorage.setItem("zqi_users", JSON.stringify(users));

  goster("✅ Qeydiyyat uğurludur! Admin təsdiqini gözlə. Giriş səhifəsinə keçirsən...", true);

  setTimeout(function(){ getGiris(); }, 1500);
}
</script>
</body>
</html>
