<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZQİ | Admin Paneli</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Plus Jakarta Sans',Arial;margin:0}
body{background:#0B1020;color:#fff;min-height:100vh}
.top{background:#132046;padding:18px 16px;text-align:center;border-bottom:1px solid #232B45}
.top b{font-size:17px;display:block}
.top small{color:#8A93B2;font-size:12px}
.wrap{max-width:900px;margin:0 auto;padding:14px 12px}
.card{background:#141A2E;border:1px solid #232B45;border-radius:14px;padding:14px;margin-bottom:12px}
.say{font-size:14px;font-weight:700;margin-bottom:10px}
.say span{color:#60A5FA}
.info{background:#1E2A4A;border-radius:8px;padding:9px 12px;font-size:13px;color:#93C5FD;margin-bottom:10px}
.btnRow{display:flex;gap:8px;flex-wrap:wrap}
button{cursor:pointer;border:0;border-radius:8px;padding:9px 14px;font-weight:700;font-size:13px}
.btnMavi{background:#2563EB;color:#fff}
.btnQirmizi{background:#DC2626;color:#fff}
.btnYasil{background:#16A34A;color:#fff}
.btnBoz{background:#1E2540;color:#CBD5E1}
h3{font-size:15px;margin-bottom:12px}
/* CƏDVƏL - SKRİNDƏKİ KİMİ */
.tableWrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:650px;font-size:13px}
thead th{background:#1E2A4A;color:#93C5FD;text-align:left;padding:10px 8px;font-size:12px;white-space:nowrap}
tbody td{padding:10px 8px;border-bottom:1px solid #1E2540;vertical-align:middle;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
.status{padding:4px 8px;border-radius:20px;font-size:11px;font-weight:800}
.status.gozleyir{background:#FEF3C7;color:#92400E}
.status.tesdiq{background:#BBF7D0;color:#065F46}
.status.redd{background:#FECACA;color:#991B1B}
.aksiya{display:flex;gap:6px}
.aksiya button{padding:7px 10px;font-size:12px}
.loginCard{max-width:400px;margin:40px auto}
input{width:100%;padding:12px;border:1px solid #232B45;border-radius:10px;background:#0B1020;color:#fff;outline:none;margin-bottom:10px}
@media(max-width:600px){ .wrap{padding:10px 8px} }
</style>
</head>
<body>

<div class="top"><b>ZQİ Riyaziyyat</b><small>Administrator paneli</small></div>

<!-- GİRİŞ -->
<div class="wrap" id="loginBox">
<div class="card loginCard"><h3 style="text-align:center">🔐 Admin Girişi</h3><p style="color:#8A93B2;font-size:13px;text-align:center;margin-bottom:12px">Ancaq admin girə bilər</p><input id="aUser" placeholder="Admin adı"><input id="aPass" type="password" placeholder="Şifrə"><p id="msg" style="display:none;color:#FCA5A5;font-size:13px;text-align:center;margin-bottom:8px"></p><button class="btnMavi" style="width:100%" onclick="adminGiris()">Daxil ol</button></div>
</div>

<!-- PANEL -->
<div class="wrap" id="panel" style="display:none">
<div class="card">
<div class="say">Şagird sayı: <span id="say">0</span></div>
<div class="info" id="infoBar">Siyahı yeniləndi ✅</div>
<div class="btnRow">
<button class="btnMavi" onclick="render()">Siyahını yenilə</button>
<button class="btnQirmizi" onclick="cixis()">Hesabdan çıx</button>
</div>
</div>

<div class="card">
<h3>Qeydiyyatdan keçən şagirdlər</h3>
<div class="tableWrap">
<table>
<thead><tr><th>Ad, soyad</th><th>İstifadəçi adı</th><th>Sinif</th><th>Yaşadığı yer</th><th>E-poçt</th><th>Telefon</th><th>Status</th><th>Əməliyyat</th></tr></thead>
<tbody id="tbody"></tbody>
</table>
</div>
<p id="bos" style="text-align:center;color:#8A93B2;padding:14px;font-size:13px;display:none">Hələ heç kim qeydiyyatdan keçməyib.</p>
</div>
</div>

<script>
function getUsers(){ try{ return JSON.parse(localStorage.getItem("zqi_users")||"[]"); }catch(e){ return []; } }
function setUsers(u){ localStorage.setItem("zqi_users", JSON.stringify(u)); }
function adminGiris(){
  var u=document.getElementById('aUser').value.trim();
  var p=document.getElementById('aPass').value.trim();
  if(u=="admin" && p=="1234"){ localStorage.setItem("zqi_admin","1"); gosterPanel(); }
  else{ var m=document.getElementById('msg'); m.style.display='block'; m.innerText="❌ Admin adı və ya şifrə səhvdir!"; }
}
function gosterPanel(){ document.getElementById('loginBox').style.display='none'; document.getElementById('panel').style.display='block'; render(); }
function cixis(){ localStorage.removeItem("zqi_admin"); location.reload(); }
function render(){
  var users=getUsers();
  document.getElementById('say').innerText=users.length;
  var tb=document.getElementById('tbody'); tb.innerHTML="";
  document.getElementById('bos').style.display = users.length==0 ? "block" : "none";
  document.getElementById('infoBar').innerText="Siyahı yeniləndi ✅ • "+new Date().toLocaleTimeString('az-AZ');
  users.forEach(function(u,i){
    var st = u.status=='approved' ? '<span class="status tesdiq">✅ Təsdiq</span>' : u.status=='rejected' ? '<span class="status redd">❌ Rədd</span>' : '<span class="status gozleyir">⏳ Gözləyir</span>';
    var btn = "";
    if(u.status!='approved') btn+='<button class="btnYasil" onclick="tesdiq('+i+')">✅ İcazə ver</button>';
    if(u.status!='rejected') btn+='<button class="btnQirmizi" onclick="redd('+i+')">❌ Rədd et</button>';
    btn+='<button class="btnBoz" onclick="sil('+i+')">🗑️ Sil</button>';
    var tr=document.createElement('tr');
    tr.innerHTML="<td><b>"+(u.ad||"-")+" "+(u.soyad||"")+"</b></td><td>@"+(u.username||"-")+"</td><td>"+(u.sinif||"-")+"</td><td>"+(u.bolge||"-")+"</td><td>"+(u.email||"-")+"</td><td>"+(u.tel||"-")+"</td><td>"+st+"</td><td><div class='aksiya'>"+btn+"</div></td>";
    tb.appendChild(tr);
  });
}
function tesdiq(i){ var u=getUsers(); u[i].status='approved'; setUsers(u); render(); alert("✅ "+u[i].ad+" təsdiqləndi! İndi girə bilər."); }
function redd(i){ var u=getUsers(); u[i].status='rejected'; setUsers(u); render(); }
function sil(i){ if(confirm("Silinsin?")){ var u=getUsers(); u.splice(i,1); setUsers(u); render(); } }
if(localStorage.getItem("zqi_admin")=="1"){ gosterPanel(); }
</script>
</body>
</html>
